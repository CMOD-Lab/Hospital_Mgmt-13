version: "3.8"

# ============================================================
# docker-compose.yml for Clinic Management System
# Application: ASP.NET Web Forms (.NET Framework 4.5.2)
# NOTE: Contains ONLY the application service.
# External services (SQL Server, Redis) are provided separately
# and connected via environment variables.
# ============================================================

services:
  dbproject:
    image: dbproject:latest
    build:
      context: .
      dockerfile: Code/DBProject/Dockerfile
    container_name: dbproject-app
    ports:
      - "80:80"
    environment:
      # Database connection — prefer full connection string
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING:-}
      - DB_HOST=${DB_HOST:-}
      - DB_NAME=${DB_NAME:-DBProject}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # Redis session state (ElastiCache or standalone Redis)
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_ACCESS_KEY=${REDIS_ACCESS_KEY:-}
      # Application Insights telemetry
      - APPINSIGHTS_INSTRUMENTATIONKEY=${APPINSIGHTS_INSTRUMENTATIONKEY:-}
    volumes:
      - app-logs:/inetpub/logs
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "powershell", "-Command",
             "try { $r = Invoke-WebRequest -Uri http://localhost/health -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { exit 0 } else { exit 1 } } catch { exit 1 }"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

volumes:
  app-logs:
    driver: local

networks:
  app-network:
    driver: nat
